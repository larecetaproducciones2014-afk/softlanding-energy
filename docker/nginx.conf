server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Igual que Cloudflare (html_handling): /hogar/index-hogar -> hogar/index-hogar.html
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }
  location ~* \.(png|jpg|jpeg|webp|svg|css|js)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
  # Nada interno debe servirse jamás
  location ~* \.(txt|pdf|docx|pptx|zip|ai|md)$ { return 404; }
}
